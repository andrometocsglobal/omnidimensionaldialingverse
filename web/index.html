<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omnidimensional · interactive</title>
<!-- Zero-build: React + Babel from CDN. No npm, deploy as a static file. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--bg:#0b1020;--panel:#161b2e;--panel2:#1e2740;--ink:#fff;--mut:#9aa4bf;
        --cyan:#22d3ee;--green:#86efac;--line:#2a3556;--amber:#f59e0b;--red:#ef4444;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
     font-family:Calibri,Segoe UI,system-ui,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px}
  h1{font-family:"Century Schoolbook",Cambria,serif;color:var(--cyan);margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
     border-radius:8px;padding:9px 10px;font-size:15px}
  button{margin-top:14px;width:100%;background:var(--cyan);color:#04121b;border:0;border-radius:10px;
     padding:11px;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:progress}
  .result{font-family:"Century Schoolbook",Cambria,serif;font-size:26px;color:var(--green);
     word-break:break-all}
  .k{color:var(--mut);font-size:13px} .mono{font-family:Consolas,monospace}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .feed{max-height:230px;overflow:auto;font-size:13px}
  .feed div{padding:6px 8px;border-bottom:1px solid var(--line)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
  .bar{flex:1;background:linear-gradient(180deg,var(--cyan),#3b82f6);border-radius:4px 4px 0 0}
  .pill{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
  .err{background:#2a1418;border:1px solid var(--red);color:#fecaca;border-radius:10px;
     padding:10px 12px;font-size:14px;margin-top:10px}
  .warn{background:#2a2113;border:1px solid var(--amber);color:#fde68a;border-radius:10px;
     padding:10px 12px;font-size:13px;margin-top:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > div{flex:1;min-width:90px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
const DEFAULT_API = (location.hostname==="localhost"||location.hostname==="127.0.0.1")
  ? location.protocol+"//"+location.hostname+":8000" : "";

// Every response is checked: the API answers 422 with a reason for anything it
// refuses, and rendering that reason beats a blank panel.
async function callApi(url, options){
  const res = await fetch(url, options);
  let body = null;
  try { body = await res.json(); } catch(e) { body = null; }
  if(!res.ok){
    const detail = body && body.detail;
    throw new Error(typeof detail === "string" ? detail
      : detail ? JSON.stringify(detail) : `HTTP ${res.status}`);
  }
  return body;
}

function App(){
  const [api,setApi] = useState(DEFAULT_API);
  const [family,setFamily] = useState("geometric");
  const [n,setN] = useState(64);
  const [a,setA] = useState(1), [d,setD] = useState(1), [r,setR] = useState(2), [p,setP] = useState(2);
  const [res,setRes] = useState(null);
  const [err,setErr] = useState(null);
  const [busy,setBusy] = useState(false);
  const [feed,setFeed] = useState([]);
  const [status,setStatus] = useState("connecting");
  const [spectrum,setSpectrum] = useState([]);
  const [mid,setMid] = useState({a:2,b:3,family:"harmonic",value:null});
  const clientId = useRef("c"+Math.floor(Math.random()*1e6));
  const base = api || location.origin;

  // WebSocket sync: every compute from ANY client is broadcast here
  useEffect(()=>{
    if(!api && location.protocol==="file:"){ setStatus("no server"); return; }
    const url = base.replace(/^http/,"ws") + "/ws";
    let socket;
    try{
      socket = new WebSocket(url);
      socket.onopen = ()=>setStatus("synced");
      socket.onclose = ()=>setStatus("disconnected");
      socket.onerror = ()=>setStatus("no server");
      socket.onmessage = (e)=>{
        const msg = JSON.parse(e.data);
        if(msg.payload && msg.payload.result!==undefined){
          setFeed(f=>[{...msg.payload,t:new Date().toLocaleTimeString()},...f].slice(0,40));
        }
      };
    }catch(e){ setStatus("no server"); }
    return ()=>{ if(socket) socket.close(); };
  },[base,api]);

  const compute = useCallback(async ()=>{
    setBusy(true); setErr(null);
    try{
      const body = {family,n:Number(n),a:Number(a),d:Number(d),r:Number(r),p:Number(p),
                    client:clientId.current};
      setRes(await callApi(base+"/api/compute",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}));
    }catch(e){ setErr(e.message); setRes(null); }
    finally{ setBusy(false); }
  },[base,family,n,a,d,r,p]);

  useEffect(()=>{
    callApi(base+"/api/spectrum?values=3,5,11,2")
      .then(s=>setSpectrum(Object.entries(s).map(([k,v])=>({k,v}))))
      .catch(()=>setSpectrum([]));
  },[base]);

  useEffect(()=>{
    callApi(`${base}/api/midpoint?a=${mid.a}&b=${mid.b}&family=${mid.family}`)
      .then(m=>setMid(v=>({...v,value:m.midpoint})))
      .catch(()=>setMid(v=>({...v,value:null})));
  },[base,mid.a,mid.b,mid.family]);

  const dotColor = {synced:"#86efac",connecting:"#f59e0b",
                    disconnected:"#ef4444","no server":"#ef4444"}[status];
  const maxV = Math.max(1e-9,...spectrum.map(s=>s.v));
  const num = (v,f)=> v===null||v===undefined ? "—" : (f?f(v):v);

  return (
   <div className="wrap">
    <h1>Omnidimensional</h1>
    <p className="sub">Interactive O(1) explorer — four families, exact closed forms, live server/client sync.</p>
    <div style={{marginBottom:12}}>
      <span className="pill"><span className="dot" style={{background:dotColor}}></span>{status}</span>{" "}
      <input style={{display:"inline-block",width:280,marginLeft:8}} value={api}
        onChange={e=>setApi(e.target.value)} placeholder="API base e.g. http://localhost:8000"/>
    </div>
    <div className="grid">
      <div className="card">
        <label>Family</label>
        <select value={family} onChange={e=>setFamily(e.target.value)}>
          <option value="arithmetic">arithmetic (AP)</option>
          <option value="geometric">geometric (GP)</option>
          <option value="harmonic">harmonic (HP)</option>
          <option value="power">power sum (k^p)</option>
        </select>
        <label>n (terms)</label>
        <input type="number" value={n} onChange={e=>setN(e.target.value)}/>
        {family==="arithmetic" && <><label>a</label><input type="number" value={a} onChange={e=>setA(e.target.value)}/>
          <label>d</label><input type="number" value={d} onChange={e=>setD(e.target.value)}/></>}
        {family==="geometric" && <><label>a</label><input type="number" value={a} onChange={e=>setA(e.target.value)}/>
          <label>r</label><input type="number" value={r} onChange={e=>setR(e.target.value)}/></>}
        {family==="harmonic" && <><label>a</label><input type="number" value={a} onChange={e=>setA(e.target.value)}/>
          <label>d</label><input type="number" value={d} onChange={e=>setD(e.target.value)}/></>}
        {family==="power" && <><label>p (power)</label><input type="number" value={p} onChange={e=>setP(e.target.value)}/></>}
        <button onClick={compute} disabled={busy}>{busy?"computing…":"Compute (O(1))"}</button>
        {err && <div className="err">{err}</div>}
      </div>

      <div style={{display:"grid",gap:18}}>
        <div className="card">
          <div className="k">Result {res && <span className="pill" style={{marginLeft:8}}>
            {res.exact_match ? "cross-checked ✓" : "MISMATCH"}</span>}</div>
          <div className="result">{res ? res.result : "—"}</div>
          {res && <>
            <div className="row" style={{marginTop:10}}>
              <div><div className="k">digits</div><div className="mono">{res.digits.toLocaleString()}</div></div>
              <div><div className="k">decimal</div><div className="mono">
                {res.decimal===null ? "overflows float" : num(res.decimal,v=>v.toPrecision(8))}</div></div>
              <div><div className="k">log10</div><div className="mono">{num(res.log10,v=>v.toFixed(3))}</div></div>
            </div>
            <div className="k mono" style={{marginTop:8}}>closed form: {res.closed_form}</div>
            {res.truncated && <div className="warn">The exact value has {res.digits.toLocaleString()} digits —
              shown in scientific notation. The computation itself was not rounded.</div>}
            {res.approximate && <div className="warn">Harmonic sums have no elementary closed form; past the
              exact cap this is the O(1) digamma approximation.</div>}
            {res.spot_checked && <div className="k" style={{marginTop:8}}>
              Cross-checked term-by-term at n = {res.verified_n.toLocaleString()} of {res.n.toLocaleString()}.</div>}
          </>}
        </div>

        <div className="card">
          <div className="k">Power-mean spectrum M_p of [3,5,11,2]</div>
          <div className="bars">
            {spectrum.map(s=>(<div key={s.k} className="bar"
              style={{height:(10+90*s.v/maxV)+"%"}} title={`p=${s.k}: ${s.v.toFixed(3)}`}></div>))}
          </div>
          <div className="k" style={{marginTop:6}}>p = {spectrum.map(s=>s.k).join(", ")} (min → max)</div>
          <div className="row" style={{marginTop:14,alignItems:"flex-end"}}>
            <div><label>midpoint a</label>
              <input type="number" value={mid.a} onChange={e=>setMid(v=>({...v,a:e.target.value}))}/></div>
            <div><label>midpoint b</label>
              <input type="number" value={mid.b} onChange={e=>setMid(v=>({...v,b:e.target.value}))}/></div>
            <div><label>family</label>
              <select value={mid.family} onChange={e=>setMid(v=>({...v,family:e.target.value}))}>
                <option>harmonic</option><option>arithmetic</option>
                <option>geometric</option><option>quadratic</option>
              </select></div>
            <div><div className="k">midpoint</div>
              <div className="mono" style={{color:"var(--green)",fontSize:18}}>
                {num(mid.value,v=>v.toPrecision(8))}</div></div>
          </div>
        </div>

        <div className="card">
          <div className="k">Live sync feed — computations from every connected client</div>
          <div className="feed">
            {feed.length===0 && <div className="k">waiting for computations…</div>}
            {feed.map((f,i)=>(
              <div key={i}><span className="mono">{f.t}</span> · <b>{f.family}</b> n={f.n}
                {" → "}<span style={{color:"var(--green)"}}>{String(f.result).slice(0,40)}</span>
                <span className="k"> · {f.client}</span></div>
            ))}
          </div>
        </div>
      </div>
    </div>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
