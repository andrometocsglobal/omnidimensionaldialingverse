name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # app + server extras so the Streamlit and FastAPI suites really run
      # instead of silently skipping.
      - run: pip install ".[app,server,dev]"
      - run: pytest -q
      - name: cli smoke test
        run: |
          omnidimensional sum power --n 100 --p 2
          omnidimensional verify geometric --n 64 --a 1 --r 2
          omnidimensional midpoint 2 3 --family harmonic
